name: CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: yarn
    - name: Install
      run: yarn
    - name: Make
      run: yarn make
    - name: Test
      run: yarn test
